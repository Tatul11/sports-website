name: Telegram — post new articles

on:
  # No native `schedule:` trigger — GitHub's own cron scheduler proved unreliable
  # (stopped firing for 10+ hours despite being active). An external cron-job.org
  # timer calls this via workflow_dispatch every 30 min instead. Keeping both would
  # risk two overlapping runs racing on the same state file.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-and-post:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sportshub-automation
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sportshub-automation/package-lock.json

      - run: npm ci

      - run: npm run telegram:watch
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_CHANNEL_ID_RU: ${{ secrets.TELEGRAM_CHANNEL_ID_RU }}

      - name: Commit updated posted-articles state
        run: |
          if ! git diff --quiet -- telegram-posted.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add telegram-posted.json
            git commit -m "chore: update telegram-posted.json [skip ci]"
            git push
          fi
